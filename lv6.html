<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Level 6: Cyber Defense - LÊ MẠNH ĐÔNG</title>
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00f2ff;
            --city-dark: #050505;
            --gold: #ffd700;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            margin: 0; padding: 0; background: var(--city-dark);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: 'Arial Rounded MT Bold', sans-serif;
            overflow: hidden; color: white;
        }

        #game-frame {
            width: 100vw; height: 100vh;
            max-width: 430px; max-height: 900px;
            background: linear-gradient(to bottom, #000 0%, #1a0b2e 100%);
            position: relative; overflow: hidden;
            display: flex; flex-direction: column;
            border: 4px solid #444; border-radius: 40px;
        }

        /* TOP BAR */
        #top-bar { height: 75px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 100; background: rgba(0,0,0,0.8); border-bottom: 2px solid var(--neon-pink); }
        .profile { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: url('avatar.jpg') center/cover; border: 2px solid var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }
        .admin-name { font-weight: 900; font-size: 11px; letter-spacing: 1px; color: #fff; }
        .score-box { color: var(--gold); font-size: 18px; font-weight: bold; }

        /* BATTLE ZONE */
        #battle-zone { flex-grow: 1; position: relative; width: 100%; }
        
        /* Hiệu ứng thành phố phía sau */
        .city-bg { position: absolute; bottom: 0; width: 100%; height: 150px; background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png'); opacity: 0.3; }

        #hero {
            position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
            font-size: 65px; z-index: 50; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 15px var(--neon-blue));
        }

        .asteroid {
            position: absolute; width: 95px; height: 95px;
            background: linear-gradient(135deg, #444, #222); border-radius: 20%;
            display: flex; justify-content: center; align-items: center;
            font-size: 38px; border: 3px solid var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.4); z-index: 10;
        }

        .laser-beam {
            position: absolute; background: var(--neon-blue);
            height: 5px; box-shadow: 0 0 25px var(--neon-blue);
            transform-origin: left center; z-index: 40; pointer-events: none; opacity: 0;
        }

        /* CONTROLS */
        #control-panel { background: #0a0a0a; padding: 25px 20px; border-top: 3px solid var(--neon-pink); }
        #timer-container { width: 100%; height: 10px; background: #222; border-radius: 10px; margin-bottom: 20px; overflow: hidden; border: 1px solid #444; }
        #timer-bar { width: 100%; height: 100%; background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink)); transition: width 0.1s linear; }

        #quest-box { background: rgba(255, 0, 255, 0.1); border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 20px; border: 1px solid var(--neon-pink); }
        #math-quest { font-size: 52px; margin: 0; color: #fff; text-shadow: 0 0 10px var(--neon-pink); }

        .ans-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .ans-btn { 
            aspect-ratio: 1; border: none; border-radius: 20px; 
            background: #111; color: white; font-size: 35px; font-weight: bold;
            cursor: pointer; border: 2px solid #333; box-shadow: 0 5px 0 #000;
        }
        .ans-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #000; border-color: var(--neon-blue); }

        /* OVERLAYS */
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .btn-main { background: var(--neon-pink); color: #fff; border: none; padding: 15px 50px; border-radius: 40px; font-weight: 900; font-size: 20px; cursor: pointer; margin-top: 30px; box-shadow: 0 0 20px var(--neon-pink); }
    </style>
</head>
<body>

<audio id="audio-bg" src="nhac-nen.mp3" loop></audio>
<audio id="audio-dung" src="dung.mp3"></audio>
<audio id="audio-sai" src="sai.mp3"></audio>
<audio id="audio-win" src="chien-thang.mp3"></audio>

<div id="game-frame">
    <div id="top-bar">
        <div class="profile">
            <div class="avatar"></div>
            <div class="admin-name">LÊ MẠNH ĐÔNG</div>
        </div>
        <div class="score-box">ĐIỂM: <span id="score">0</span></div>
    </div>

    <div id="battle-zone">
        <div class="city-bg"></div>
        <div id="hero">🤖</div>
        <div id="laser-line" class="laser-beam"></div>
    </div>

    <div id="control-panel">
        <div id="timer-container"><div id="timer-bar"></div></div>
        <div id="quest-box"><h2 id="math-quest">-- + --</h2></div>
        <div class="ans-grid">
            <button class="ans-btn" onclick="checkAns(this)"></button>
            <button class="ans-btn" onclick="checkAns(this)"></button>
            <button class="ans-btn" onclick="checkAns(this)"></button>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-start" class="overlay" style="display: flex;">
        <h1 style="color: var(--neon-blue); font-size: 50px; margin: 0;">LEVEL 6</h1>
        <h2 style="color: var(--neon-pink);">CYBER CITY</h2>
        <p>Phạm vi 20 - 40 (Không nhớ)</p>
        <button class="btn-main" onclick="startGame()">BẮT ĐẦU PHÒNG THỦ</button>
    </div>

    <div id="modal-win" class="overlay">
        <h1 style="color: var(--gold); font-size: 40px;">THÀNH PHỐ AN TOÀN!</h1>
        <!-- Đã sửa: Gọi hàm goToLevel7() -->
        <button class="btn-main" onclick="goToLevel7()">SANG LEVEL 7</button>
    </div>

    <div id="modal-lose" class="overlay">
        <h1 style="color: var(--neon-pink);">HỆ THỐNG LỖI!</h1>
        <button class="btn-main" onclick="location.reload()">THỬ LẠI</button>
    </div>
</div>

<script>
    let score = 0, currentAns = 0, gameActive = false, count = 0;
    const goal = 10;
    let timerWidth = 100;
    let timerId;

    // Phím T/L Test
    document.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        if (e.key.toLowerCase() === 't') victory();
        if (e.key.toLowerCase() === 'l') gameOver();
    });

    function playSnd(id) {
        const s = document.getElementById(id);
        if(s) { s.currentTime = 0; s.play().catch(()=>{}); }
    }

    function startGame() {
        document.getElementById('modal-start').style.display = 'none';
        gameActive = true;
        playSnd('audio-bg');
        newLevel();
        runTimer();
    }

    function generateMath() {
        let n1, n2, sum;
        while(true) {
            n1 = Math.floor(Math.random() * 25) + 5; 
            n2 = Math.floor(Math.random() * 25) + 5; 
            sum = n1 + n2;
            if (sum >= 20 && sum <= 40) {
                if ((n1 % 10) + (n2 % 10) <= 9) { 
                    if (n1 % 10 > 1 && n2 % 10 > 1) break; 
                }
            }
        }
        return [n1, n2];
    }

    function newLevel() {
        if (count >= goal) { victory(); return; }
        const [n1, n2] = generateMath();
        currentAns = n1 + n2;
        document.getElementById('math-quest').innerText = `${n1} + ${n2}`;
        
        let alt = [currentAns, currentAns + 2, currentAns - 2];
        alt = [...new Set(alt)].sort(() => Math.random() - 0.5);
        document.querySelectorAll('.ans-btn').forEach((b, i) => b.innerText = alt[i]);
        
        timerWidth = 100;
        spawnAsteroid();
    }

    function runTimer() {
        timerId = setInterval(() => {
            if (!gameActive) return;
            timerWidth -= (100 / 150); 
            document.getElementById('timer-bar').style.width = timerWidth + "%";
            
            const ast = document.getElementById('active-ast');
            if (ast) ast.style.top = (100 - timerWidth) * 4.5 + "px";

            if (timerWidth <= 0) gameOver();
        }, 100);
    }

    function spawnAsteroid() {
        const zone = document.getElementById('battle-zone');
        if (document.getElementById('active-ast')) document.getElementById('active-ast').remove();
        
        const ast = document.createElement('div');
        ast.className = 'asteroid';
        ast.id = 'active-ast';
        ast.innerText = "👾"; 
        ast.style.left = Math.random() * (zone.offsetWidth - 120) + 60 + "px";
        ast.style.top = "0px";
        zone.appendChild(ast);
    }

    function checkAns(btn) {
        if (!gameActive) return;
        if (parseInt(btn.innerText) === currentAns) {
            playSnd('audio-dung');
            fireLaser();
            score += 150;
            count++;
            document.getElementById('score').innerText = score;
            setTimeout(newLevel, 600);
        } else {
            playSnd('audio-sai');
            document.getElementById('game-frame').style.animation = "shake 0.3s";
            setTimeout(() => document.getElementById('game-frame').style.animation = "", 300);
        }
    }

    function fireLaser() {
        const hero = document.getElementById('hero');
        const ast = document.getElementById('active-ast');
        const laser = document.getElementById('laser-line');
        if (!ast) return;

        const hRect = hero.getBoundingClientRect();
        const aRect = ast.getBoundingClientRect();
        const fRect = document.getElementById('game-frame').getBoundingClientRect();

        const x1 = hRect.left + hRect.width / 2 - fRect.left;
        const y1 = hRect.top + 20 - fRect.top;
        const x2 = aRect.left + aRect.width / 2 - fRect.left;
        const y2 = aRect.top + aRect.height / 2 - fRect.top;

        laser.style.width = Math.hypot(x2-x1, y2-y1) + "px";
        laser.style.left = x1 + "px";
        laser.style.top = y1 + "px";
        laser.style.transform = `rotate(${Math.atan2(y2-y1, x2-x1)}rad)`;
        laser.style.opacity = "1";

        hero.style.left = (aRect.left + aRect.width/2 - fRect.left) + "px";

        setTimeout(() => {
            laser.style.opacity = "0";
            ast.innerHTML = "⚡";
            ast.style.background = "var(--neon-blue)";
        }, 200);
    }

    function victory() {
        gameActive = false;
        clearInterval(timerId);
        playSnd('audio-win');
        document.getElementById('modal-win').style.display = 'flex';
    }

    function gameOver() {
        gameActive = false;
        clearInterval(timerId);
        document.getElementById('modal-lose').style.display = 'flex';
    }

    // Hàm chuyển hướng sang Level 7
    function goToLevel7() {
        window.location.href = "lv7.html";
    }
</script>

<style>
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
    }
</style>
</body>
</html>
