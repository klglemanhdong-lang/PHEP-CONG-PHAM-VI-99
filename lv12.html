<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Level 12: Thunderbolt Storm - LÊ MẠNH ĐÔNG</title>
    <style>
        /* ĐỔI TÔNG MÀU SANG XANH CYAN ĐIỆN TỬ */
        :root { --radar-color: #00f2ff; --bg-dark: #00080a; --gold: #ffd700; --heart: #ff4d4d; --lightning: #fff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Share Tech Mono', monospace; overflow: hidden; color: var(--radar-color); }

        #game-frame {
            width: 100vw; height: 100vh; max-width: 430px; max-height: 900px;
            background: var(--bg-dark); position: relative; overflow: hidden; display: flex; flex-direction: column;
            border: 4px solid #111; border-radius: 40px;
        }

        #top-bar { height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: rgba(0,0,0,0.9); z-index: 100; border-bottom: 1px solid var(--radar-color); }
        .profile { display: flex; align-items: center; gap: 12px; }
        .avatar { 
            width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--radar-color); 
            background: url('avatar.jpg') center/cover; 
            box-shadow: 0 0 10px var(--radar-color);
        }
        .admin-name { font-weight: bold; font-size: 14px; color: var(--radar-color); }
        .hearts { color: var(--heart); font-size: 20px; }

        #progress-bar { position: absolute; top: 80px; width: 100%; height: 5px; background: #111; z-index: 90; }
        #progress-fill { width: 0%; height: 100%; background: var(--gold); transition: width 0.3s; }

        #play-area { flex-grow: 1; position: relative; z-index: 10; display: flex; justify-content: center; align-items: center; }
        
        /* PHÉP TÍNH: ĐÃ ĐƯA VÀO TÂM RADAR */
        #vertical-math {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); /* Giữa tâm tuyệt đối */
            display: flex; flex-direction: column; align-items: flex-end;
            color: #fff; font-size: 48px; font-weight: 900; line-height: 1.1;
            text-shadow: 0 0 10px var(--radar-color), 0 0 20px #000;
            z-index: 50; pointer-events: none;
        }
        .math-container { position: relative; padding: 10px; width: fit-content; }
        .math-line { border-bottom: 5px solid #fff; margin-top: 5px; width: 120%; margin-left: -20%; }
        .math-sign { position: absolute; left: -40px; bottom: 20px; font-size: 40px; }

        #radar-screen {
            width: 320px; height: 320px; border: 2px solid var(--radar-color);
            border-radius: 50%; position: relative;
            background: 
                repeating-radial-gradient(circle, transparent 0, transparent 39px, rgba(0,242,255,0.1) 40px),
                linear-gradient(90deg, transparent 49.5%, rgba(0,242,255,0.2) 50%, transparent 50.5%),
                linear-gradient(0deg, transparent 49.5%, rgba(0,242,255,0.2) 50%, transparent 50.5%);
            box-shadow: inset 0 0 30px rgba(0,242,255,0.1);
        }

        #radar-sweep {
            position: absolute; width: 50%; height: 50%; top: 0; left: 50%;
            background: linear-gradient(0deg, transparent, rgba(0,242,255,0.5));
            transform-origin: bottom left; animation: sweep 2.5s linear infinite;
            border-left: 1px solid var(--radar-color); z-index: 5;
        }
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .target-node {
            position: absolute; width: 75px; height: 75px;
            border: 2px solid var(--radar-color); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px; font-weight: bold; cursor: pointer;
            background: rgba(0,8,10,0.9); z-index: 60;
            transition: all 0.2s; color: var(--radar-color);
        }
        /* VỊ TRÍ ĐÁP ÁN ĐÃ KHÓA CHẶT */
        #ans-0 { top: -45px; left: 50%; transform: translateX(-50%); } 
        #ans-1 { bottom: -15px; left: 85%; } 
        #ans-2 { bottom: -15px; right: 85%; } 

        .target-node.hit {
            background: var(--lightning) !important; border-color: var(--gold) !important;
            color: #000 !important; box-shadow: 0 0 50px var(--gold); transform: scale(1.2);
        }
        #ans-0.hit { transform: translateX(-50%) scale(1.2) !important; }
        .target-node.wrong { background: rgba(255, 77, 77, 0.4) !important; border-color: var(--heart) !important; }

        #launcher {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 50px; border: 3px solid var(--radar-color);
            background: repeating-linear-gradient(0deg, #111, #111 2px, var(--radar-color) 3px);
            border-radius: 10px 10px 0 0; z-index: 30; display: flex; justify-content: center;
        }
        #launcher-tip { width: 14px; height: 22px; background: var(--lightning); transform: translateY(-12px); border-radius: 5px; box-shadow: 0 0 25px var(--lightning); }

        #lightning-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; display: none; }
        #lightning-path { stroke: var(--gold); stroke-width: 10; fill: none; stroke-linecap: round; filter: blur(1px); }
        #lightning-path-inner { stroke: #fff; stroke-width: 4; fill: none; }

        #control-panel { background: #000; padding: 20px; border-top: 1px solid var(--radar-color); }
        #timer-bar { width: 100%; height: 12px; background: #111; border-radius: 6px; overflow: hidden; }
        #timer-fill { width: 100%; height: 100%; background: var(--radar-color); transition: width 0.1s linear; }

        .overlay { position: absolute; inset: 0; background: rgba(0,8,10,0.98); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; text-align: center; padding: 20px; }
        .btn-main { background: var(--radar-color); color: black; border: none; padding: 18px 50px; font-weight: 900; cursor: pointer; font-family: inherit; font-size: 20px; border-radius: 5px; text-transform: uppercase; }
    </style>
</head>
<body>

<audio id="audio-bg-2" src="nhac-nen-2.mp3" loop></audio>
<audio id="audio-dung" src="dung.mp3"></audio>
<audio id="audio-sai" src="sai.mp3"></audio>
<audio id="audio-win" src="chien-thang.mp3"></audio>

<div id="game-frame">
    <div id="top-bar">
        <div class="profile">
            <div class="avatar"></div>
            <div class="admin-name">LÊ MẠNH ĐÔNG</div>
        </div>
        <div id="heart-box" class="hearts">❤️❤️❤️</div>
    </div>
    
    <div id="progress-bar"><div id="progress-fill"></div></div>

    <div id="play-area">
        <div id="radar-screen">
            <!-- PHÉP TÍNH Ở TRONG TÂM RADAR -->
            <div id="vertical-math">
                <div class="math-container">
                    <div id="num1">--</div>
                    <div id="num2">--</div>
                    <div class="math-sign">+</div>
                    <div class="math-line"></div>
                </div>
            </div>

            <div id="radar-sweep"></div>
            <div id="ans-0" class="target-node"></div>
            <div id="ans-1" class="target-node"></div>
            <div id="ans-2" class="target-node"></div>
        </div>
        
        <div id="launcher"><div id="launcher-tip"></div></div>
        <svg id="lightning-svg" viewBox="0 0 430 900">
            <path id="lightning-path" d="" />
            <path id="lightning-path-inner" d="" />
        </svg>
    </div>

    <div id="control-panel"><div id="timer-bar"><div id="timer-fill"></div></div></div>

    <!-- MODALS -->
    <div id="modal-start" class="overlay">
        <h1 style="font-size: 36px; color: var(--radar-color); margin-bottom: 10px;">LEVEL 12</h1>
        <h2 style="color: var(--gold); margin-bottom: 20px;">THUNDERBOLT STORM</h2>
        <p style="color: #fff; margin-bottom: 30px;">20 NHIỆM VỤ | TỔNG CẬN 99</p>
        <button class="btn-main" onclick="initGame()">BẮT ĐẦU CÔNG PHÁ</button>
    </div>

    <div id="modal-win" class="overlay" style="display:none">
        <h1 style="color: var(--gold); font-size: 35px;">NHIỆM VỤ HOÀN THÀNH!</h1>
        <p style="margin: 20px 0; font-size: 18px;">Bạn là bậc thầy Radar!</p>
        <button class="btn-main" onclick="nextLevel()">TIẾP THEO</button>
    </div>

    <div id="modal-lose" class="overlay" style="display:none">
        <h1 style="color: var(--heart); font-size: 35px;">HỆ THỐNG SỤP ĐỔ</h1>
        <button class="btn-main" style="margin-top:20px" onclick="location.reload()">KHỞI ĐỘNG LẠI</button>
    </div>
</div>

<script>
    let lives = 3, count = 0, currentAns = 0, gameActive = false, timerWidth = 100, timerId;
    let questionBank = [];
    const totalQuestions = 20;

    document.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        if (e.key.toLowerCase() === 't') victory();
        if (e.key.toLowerCase() === 'l') gameOver();
    });

    function playSnd(id) { 
        const s = document.getElementById(id); 
        if(s) { s.currentTime = 0; s.play().catch(()=>{}); } 
    }

    function prepareQuestions() {
        let poolNormal = [], poolUltra = [];
        for (let i = 20; i <= 89; i++) {
            for (let j = 10; j <= 79; j++) {
                let sum = i + j;
                if (i % 10 + j % 10 <= 9) {
                    if (sum >= 50 && sum <= 89) poolNormal.push({ n1: i, n2: j, ans: sum });
                    if (sum >= 90 && sum <= 99) poolUltra.push({ n1: i, n2: j, ans: sum });
                }
            }
        }
        poolNormal.sort(() => Math.random() - 0.5);
        poolUltra.sort(() => Math.random() - 0.5);
        questionBank = [...poolNormal.slice(0, 15), ...poolUltra.slice(0, 5)];
    }

    function initGame() {
        prepareQuestions();
        document.getElementById('modal-start').style.display = 'none';
        gameActive = true;
        const bg = document.getElementById('audio-bg-2');
        bg.volume = 0.1; bg.play().catch(()=>{});
        newLevel();
        startTimer();
    }

    function newLevel() {
        if (count >= totalQuestions) { victory(); return; }
        const q = questionBank[count];
        currentAns = q.ans;
        document.getElementById('progress-fill').style.width = (count / totalQuestions * 100) + "%";
        document.getElementById('num1').innerText = q.n1;
        document.getElementById('num2').innerText = q.n2;
        
        let answers = [q.ans, q.ans + 1, q.ans - 1].sort(() => Math.random() - 0.5);
        for(let i=0; i<3; i++) {
            const el = document.getElementById(`ans-${i}`);
            el.innerText = answers[i];
            el.classList.remove('hit', 'wrong');
            el.style.opacity = "1";
            el.onclick = (e) => fireLightning(e, answers[i]);
        }
        timerWidth = 100;
    }

    function fireLightning(e, val) {
        if (!gameActive) return;
        const target = e.currentTarget;
        const svg = document.getElementById('lightning-svg');
        
        if (val === currentAns) {
            gameActive = false;
            playSnd('audio-dung');
            const frameRect = document.getElementById('game-frame').getBoundingClientRect();
            const launchRect = document.getElementById('launcher-tip').getBoundingClientRect();
            const targetRect = target.getBoundingClientRect();
            
            const sX = launchRect.left + launchRect.width / 2 - frameRect.left;
            const sY = launchRect.top - frameRect.top;
            const eX = targetRect.left + targetRect.width / 2 - frameRect.left;
            const eY = targetRect.top + targetRect.height / 2 - frameRect.top;

            let d = `M ${sX} ${sY}`;
            for(let i=1; i<=10; i++) {
                d += ` L ${sX + (eX-sX)*i/10 + (Math.random()-0.5)*50} ${sY + (eY-sY)*i/10 + (Math.random()-0.5)*25}`;
            }
            d += ` L ${eX} ${eY}`;
            
            document.getElementById('lightning-path').setAttribute('d', d);
            document.getElementById('lightning-path-inner').setAttribute('d', d);
            svg.style.display = "block";
            target.classList.add('hit');

            setTimeout(() => {
                svg.style.display = "none";
                target.style.opacity = "0";
                count++;
                gameActive = true;
                newLevel();
            }, 500);
        } else {
            lives--; playSnd('audio-sai'); updateHearts();
            target.classList.add('wrong');
            if (lives <= 0) gameOver();
        }
    }

    function startTimer() {
        if (timerId) clearInterval(timerId);
        timerId = setInterval(() => {
            if (!gameActive) return;
            timerWidth -= (count > 15 ? 0.8 : 0.6); 
            document.getElementById('timer-fill').style.width = timerWidth + "%";
            if (timerWidth <= 0) {
                lives--; updateHearts(); playSnd('audio-sai');
                if (lives <= 0) gameOver(); else { count++; newLevel(); }
            }
        }, 100);
    }

    function updateHearts() { document.getElementById('heart-box').innerText = "❤️".repeat(lives); }
    function victory() { gameActive = false; clearInterval(timerId); playSnd('audio-win'); document.getElementById('modal-win').style.display = 'flex'; }
    function gameOver() { gameActive = false; clearInterval(timerId); document.getElementById('modal-lose').style.display = 'flex'; }
    function nextLevel() { window.location.href = "level13.html"; }
</script>
</body>
</html>
